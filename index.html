<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Hari Prasath's AI Chatbot</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="chat-container">

    <!-- HEADER -->
    <header class="chat-header">

        <div class="header-icon">
            🤖
        </div>

        <div class="header-text">
            <h1>Hari Prasath's AI Chatbot</h1>

            <p>
                Speech recognition powered by Vosk
            </p>

            <p>
                Chatbot powered by Qwen 2.5 0.5B
            </p>
        </div>

    </header>


    <!-- CHAT AREA -->
    <main class="chat-box" id="chatBox">

        <div class="message bot-message">

            <div class="message-avatar">
                🤖
            </div>

            <div class="message-content">

                <div class="message-name">
                    AI Assistant
                </div>

                <div class="message-text">
                    Hello! 👋
                    <br>
                    How can I help you today?
                </div>

            </div>

        </div>

    </main>


    <!-- INPUT AREA -->
    <footer class="input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                id="micButton"
                class="icon-button mic-button"
                title="Start recording"
                type="button"
            >
                🎤
            </button>

            <button
                id="sendButton"
                class="send-button"
                type="button"
            >
                Send
            </button>

        </div>

        <div
            id="statusText"
            class="status-text"
        >
            Ready
        </div>

    </footer>

</div>


<script src="script.js"></script>


</body>

</html>
